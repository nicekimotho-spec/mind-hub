name: mind-hub

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mindhub
      POSTGRES_PASSWORD: mindhub
      POSTGRES_DB: mindhub_dev
    ports:
      - "5545:5432"
    volumes:
      - mindhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: mindhub
      POSTGRES_PASSWORD: mindhub
      POSTGRES_DB: mindhub_test
    ports:
      - "5546:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"

volumes:
  mindhub_postgres_data:
